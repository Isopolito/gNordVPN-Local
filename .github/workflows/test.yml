name: Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install glib tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin
      - run: npm ci
      - run: npm test
      - name: Validate GSettings schema
        run: glib-compile-schemas --strict --dry-run schemas/
